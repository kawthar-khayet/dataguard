# Connexion à PostgreSQL. Les valeurs viennent des variables d'environnement (fichier .env),
# jamais écrites en dur ici.
dataguard:
  target: dev
  outputs:
    dev:
      type: postgres
      host: localhost
      port: "{{ env_var('POSTGRES_PORT') | int }}"
      dbname: "{{ env_var('POSTGRES_DB') }}"
      user: "{{ env_var('POSTGRES_USER') }}"
      password: "{{ env_var('POSTGRES_PASSWORD') }}"
      schema: public
      threads: 4
