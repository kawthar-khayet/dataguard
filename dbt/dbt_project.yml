# DataGuard — projet dbt
#
#   raw (ingestion Python) ──► staging ──► marts ──► protected (vues masquées par rôle)
#
# Deux phases :
#   tag:transform  → staging + marts      (nettoyer, dédoublonner, relier les systèmes)
#   tag:protected  → vues analyst/support (appliquer les politiques APPROUVÉES)
# Entre les deux : le scanner analyse les couches et un humain valide les politiques.
name: dataguard
version: "2.0.0"
config-version: 2
profile: dataguard

model-paths: ["models"]
macro-paths: ["macros"]
test-paths: ["tests"]
seed-paths: ["seeds"]

on-run-start:
  - "{{ create_roles() }}"
  - "{{ store_hash_salt() }}"
  - "{{ create_text_anonymized() }}"
on-run-end:
  - "{{ grant_access() }}"

seeds:
  dataguard:
    +schema: ref                 # tables de référence (ex. normalisation des villes)

models:
  dataguard:
    staging:
      +schema: staging
      +materialized: view        # nettoyage « à la lecture », toujours à jour avec raw
      +tags: ["transform"]
    marts:
      +schema: marts
      +materialized: table       # tables métier, prêtes pour l'analyse
      +tags: ["transform"]
    protected:
      +materialized: view        # une vue ne copie pas les données : elle masque à la lecture
      +tags: ["protected"]
      analyst:
        +schema: analyst         # tout est masqué
        +grants:
          select: ["analyst"]
      support:
        +schema: support         # « Confidentiel » en clair, « Restreint » masqué
        +grants:
          select: ["support_client"]
